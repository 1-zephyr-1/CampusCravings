<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square brand mark background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#DC2626"/>
  <!-- Subtle inner highlight -->
  <rect x="32" y="32" width="448" height="448" rx="72" ry="72" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <!-- Stylized "CC" monogram in white -->
  <g fill="#FFFFFF" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="312" font-size="260" letter-spacing="-8">CC</text>
  </g>
  <!-- Small accent dot representing a craving/meal spark -->
  <circle cx="392" cy="128" r="14" fill="#F59E0B"/>
</svg>
